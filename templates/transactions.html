<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transactions - Finance Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #222;
        }

        /* Navigation */

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
        }

        /* Transactions Box */

        .transactions {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .transactions h2 {
            margin-bottom: 20px;
        }
        /* Filters */

.filter-form {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    align-items: end;
    margin-bottom: 25px;
    padding: 18px;
    background-color: #f8fafc;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filter-group label {
    font-size: 14px;
    font-weight: bold;
}

.filter-group select,
.filter-group input {
    padding: 9px 12px;
    border: 1px solid #d1d5db;
    border-radius: 5px;
    background-color: white;
    font-size: 14px;
}

.filter-button,
.clear-button {
    padding: 10px 16px;
    border-radius: 5px;
    border: none;
    text-decoration: none;
    font-size: 14px;
    cursor: pointer;
}

.filter-button {
    background-color: #2563eb;
    color: white;
}

.clear-button {
    background-color: #6b7280;
    color: white;
}

.filter-button:hover,
.clear-button:hover {
    opacity: 0.85;
}

        /* Table */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f3f4f6;
        }

        tr:hover {
            background-color: #f9fafb;
        }

        /* Income / Expense */

        .income-text {
            color: #16a34a;
            font-weight: bold;
        }

        .expense-text {
            color: #dc2626;
            font-weight: bold;
        }

        /* Action Buttons */

        .action-buttons {
            white-space: nowrap;
        }

        .edit-button,
        .delete-button {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 13px;
        }

        .edit-button {
            background-color: #2563eb;
            color: white;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
        }

        .edit-button:hover,
        .delete-button:hover {
            opacity: 0.85;
        }

        /* Empty Message */

        .empty-message {
            text-align: center;
            color: #666;
            padding: 25px;
        }

        /* Back Button */

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .back-button:hover {
            opacity: 0.85;
        }

        /* Responsive Design */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .navbar a {
                margin: 0 8px;
            }

            .container {
                width: 95%;
            }

            .transactions {
                padding: 15px;
            }

            table {
                font-size: 13px;
            }

            th,
            td {
                padding: 10px;
            }

        }

    </style>

</head>

<body>
    {% if messages %}
        {% for message in messages %}
            <div style="
                padding: 12px;
                margin: 15px auto;
                max-width: 1200px;
                background-color: #d1fae5;
                color: #065f46;
                border-radius: 6px;
                text-align: center;
                font-weight: 500;
        ">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}


    <!-- Navigation -->

    <nav class="navbar">

        <h1>Finance Tracker</h1>

        <div>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'transactions' %}">
                Transactions
            </a>

            <a href="{% url 'set_budget' %}">
                Budget
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container">

        <section class="transactions">

            <h2>
                All Transactions
            </h2>
            <!-- Filters -->

<form method="GET" class="filter-form">

    <div class="filter-group">

        <label for="type">
            Type
        </label>

        <select name="type" id="type">

            <option value="">
                All
            </option>

            <option value="income"
                {% if selected_type == 'income' %}selected{% endif %}>
                Income
            </option>

            <option value="expense"
                {% if selected_type == 'expense' %}selected{% endif %}>
                Expense
            </option>

        </select>

    </div>


    <div class="filter-group">

        <label for="category">
            Category
        </label>

        <select name="category" id="category">

            <option value="">
                All
            </option>

            {% for category in categories %}

            <option value="{{ category.id }}"
                {% if selected_category == category.id|stringformat:"s" %}selected{% endif %}>

                {{ category.name }}

            </option>

            {% endfor %}

        </select>

    </div>


    <div class="filter-group">

        <label for="date">
            Date
        </label>

        <input
            type="date"
            name="date"
            id="date"
            value="{{ selected_date|default:'' }}"
        >

    </div>


    <button type="submit" class="filter-button">
        Apply Filters
    </button>


    <a href="{% url 'transactions' %}" class="clear-button">
        Clear Filters
    </a>

</form>


            <table>

                <thead>

                    <tr>

                        <th>Date</th>

                        <th>Description</th>

                        <th>Category</th>

                        <th>Type</th>

                        <th>Amount</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="transactionsTableBody"></tbody>

                   

                        

                

            </table>


            <a
                href="{% url 'home' %}"
                class="back-button">

                ← Back to Dashboard

            </a>

        </section>

    </main>
    <script>
    const FASTAPI_URL = "https://personal-finance-api-pwps.onrender.com";
    let accessToken = sessionStorage.getItem("access_token");

function getAccessToken() {
    if (accessToken) {
        return Promise.resolve(accessToken)
    }

    return fetch("/api-token/")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to get access token");
            }
            return response.json();
        })
        .then(data => {
            accessToken = data.access_token;
            sessionStorage.setItem("access_token", accessToken);
            return accessToken;
        });
}
function getCookie(name) {
    const cookies = document.cookie.split(";");

    for (let cookie of cookies) {
        cookie = cookie.trim();

        if (cookie.startsWith(name + "=")) {
            return decodeURIComponent(cookie.substring(name.length + 1));
        }
    }

    return "";
}
getAccessToken()
    .then(token => {
        return fetch(FASTAPI_URL + "/api/transactions/", {
            method: "GET",
            headers: {
                "Authorization": "Bearer " + token
            }
        });
    })
    .then(response => {
        console.log("FastAPI Transaction Status:", response.status);
        return response.json();
    })
  .then(data => {

    console.log("FastAPI Transactions:", data);

    const tableBody = document.getElementById("transactionsTableBody");

    tableBody.innerHTML = "";

    const params = new URLSearchParams(window.location.search);

const filteredData = data.filter(transaction => {
    const type = params.get("type");
    const category = params.get("category");
    const categorySelect = document.getElementById("category");
    const selectedCategory = categorySelect
    ? categorySelect.options[categorySelect.selectedIndex].text
    : "";
    const date = params.get("date");

    if (type && transaction.type !== type) {
        return false;
    }

    if (category && selectedCategory !== "All" && transaction.category !== selectedCategory) {
        return false;
    }

    if (date && transaction.date !== date) {
        return false;
    }

    return true;
});

filteredData.forEach(transaction => {

        const row = document.createElement("tr");

        row.innerHTML = `
    <td>${transaction.date}</td>
    <td>${transaction.description}</td>
    <td>${transaction.category}</td>
    <td class="${transaction.type === 'income' ? 'income-text' : 'expense-text'}">
        ${transaction.type.charAt(0).toUpperCase() + transaction.type.slice(1)}
    </td>
    <td class="${transaction.type === 'income' ? 'income-text' : 'expense-text'}">
        ₹${transaction.amount.toFixed(2)}
    </td>
    <td class="action-buttons">
        <a href="/transactions/edit/${transaction.id}/" class="edit-button">
            Edit
        </a>

        <form method="POST"
              action="/transactions/delete/${transaction.id}/"
              style="display: inline;">

            <input type="hidden" name="csrfmiddlewaretoken" value="${getCookie('csrftoken')}">

            <button type="submit"
                    class="delete-button"
                    onclick="return confirm('Are you sure you want to delete this transaction?');">
                Delete
            </button>

        </form>
    </td>
`;

        tableBody.appendChild(row);

    });

})
    .catch(error => {
        console.error("FastAPI connection error:", error);
    });
</script>


</body>

</html>
