<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Transaction - Finance Tracker</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            color: #222;
        }

        /* Navigation */

        .navbar {
            background-color: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        /* Main Container */

        .container {
            width: 90%;
            max-width: 600px;
            margin: 40px auto;
        }

        /* Form Box */

        .form-box {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .form-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        /* Form */

        form p {
            margin-bottom: 18px;
        }

        label {
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* Update Button */

        .update-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .update-button:hover {
            opacity: 0.85;
        }

        /* Cancel Button */

        .back-button {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #2563eb;
            text-decoration: none;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        /* Responsive */

        @media (max-width: 768px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .navbar a {
                margin: 0 8px;
            }

            .container {
                width: 95%;
            }

        }

    </style>

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar">

        <h1>Finance Tracker</h1>

        <div>

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'transactions' %}">
                Transactions
            </a>

            <a href="{% url 'set_budget' %}">
                Budget
            </a>

            <a href="{% url 'logout' %}">
                Logout
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container">

        <section class="form-box">

            <h2>
                Edit Transaction
            </h2>


            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}


                <button
                    type="submit"
                    class="update-button">

                    Update Transaction

                </button>

            </form>


            <a
                href="{% url 'transactions' %}"
                class="back-button">

                ← Cancel

            </a>

        </section>

    </main>


</body>

</html>
